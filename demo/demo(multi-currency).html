<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuiOutKit Multi-Currency Demo</title>
  <link rel="stylesheet" href="https://api.staging.suioutkit.xyz/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top right, #1e1b4b 0%, #09090b 100%);
      color: #f3f4f6;
      font-family: Inter, system-ui, sans-serif;
      padding: 24px;
    }

    .card {
      width: min(720px, 100%);
      padding: 40px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(18px);
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 16px 0 8px;
      font-size: clamp(32px, 5vw, 48px);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    p {
      color: #9ca3af;
      line-height: 1.6;
    }

    code {
      color: #a5b4fc;
    }

    .currency-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 24px;
    }

    .currency-card {
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .currency-card:hover {
      border-color: rgba(99, 102, 241, 0.5);
      background: rgba(99, 102, 241, 0.08);
      transform: translateY(-2px);
    }

    .currency-card .symbol {
      font-size: 24px;
      font-weight: 800;
      color: #a5b4fc;
    }

    .currency-card .code {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 4px;
    }

    .currency-card .amount {
      font-size: 14px;
      font-weight: 700;
      color: #f3f4f6;
      margin-top: 8px;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    .status {
      margin-top: 22px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.22);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      white-space: pre-wrap;
      min-height: 40px;
    }

    .ok { color: #34d399; }
    .err { color: #f87171; }
  </style>
</head>

<body>
  <main class="card">
    <span class="badge">Multi-Currency Demo</span>
    <h1>Pay in Your Currency</h1>
    <p>Select a currency below to checkout. The SDK resolves the correct fiat-to-crypto rate automatically.</p>

    <div class="currency-grid" id="currency-grid"></div>

    <div class="status" id="status">Loading currencies...</div>
  </main>

  <script type="module">
    const BACKEND_URL = "https://api.staging.suioutkit.xyz";
    const MERCHANT_ADDRESS = "0x534e227f48fc630b92298948ee57b75db82e7388896f4eefe34e040494f61581";
    const SDK_URL = "https://unpkg.com/suioutkit@latest/dist/index.js";

    const currencies = [
      { code: "NGN", symbol: "\u20A6", amount: 1500, name: "Nigerian Naira" },
      { code: "USD", symbol: "$", amount: 10, name: "US Dollar" },
      { code: "GBP", symbol: "\u00A3", amount: 8, name: "British Pound" },
      { code: "EUR", symbol: "\u20AC", amount: 9, name: "Euro" },
      { code: "CAD", symbol: "C$", amount: 13, name: "Canadian Dollar" },
      { code: "AUD", symbol: "A$", amount: 15, name: "Australian Dollar" },
      { code: "JPY", symbol: "\u00A5", amount: 1500, name: "Japanese Yen" },
      { code: "INR", symbol: "\u20B9", amount: 850, name: "Indian Rupee" },
      { code: "BRL", symbol: "R$", amount: 50, name: "Brazilian Real" },
      { code: "ZAR", symbol: "R", amount: 190, name: "South African Rand" },
      { code: "KES", symbol: "KSh", amount: 1300, name: "Kenyan Shilling" },
      { code: "SGD", symbol: "S$", amount: 13, name: "Singapore Dollar" },
    ];

    const statusEl = document.getElementById("status");
    const grid = document.getElementById("currency-grid");

    async function loadSdk() {
      const module = await import(SDK_URL);
      return module.SuiOutKit;
    }

    let sdk;

    async function init() {
      try {
        const SuiOutKit = await loadSdk();
        sdk = new SuiOutKit({ merchantAddress: MERCHANT_ADDRESS, mode: "test" });
        statusEl.textContent = "SDK loaded. Click a currency to pay.";
        statusEl.className = "status ok";
        renderCards();
      } catch (err) {
        statusEl.textContent = `SDK failed to load: ${err.message}`;
        statusEl.className = "status err";
      }
    }

    function renderCards() {
      grid.innerHTML = currencies.map((c) => `
        <div class="currency-card" data-currency="${c.code}" data-amount="${c.amount}">
          <div class="symbol">${c.symbol}</div>
          <div class="code">${c.code} &middot; ${c.name}</div>
          <div class="amount">${c.symbol}${c.amount.toLocaleString()}</div>
        </div>
      `).join("");

      grid.querySelectorAll(".currency-card").forEach((card) => {
        card.addEventListener("click", async () => {
          const currency = card.dataset.currency;
          const amount = parseInt(card.dataset.amount, 10);
          if (!sdk) return;

          card.style.opacity = "0.5";
          statusEl.textContent = `Creating ${currency} checkout session...`;
          statusEl.className = "status";

          try {
            const session = await sdk.initCheckout({
              amount,
              currency,
              metadata: { source: "demo-multi-currency.html", currency }
            });
            statusEl.textContent = `Session created (${session.resolvedCurrency || currency}). Opening modal...`;
            sdk.openModal(session, {
              autoCloseOnSuccess: true,
              onClose: () => {
                card.style.opacity = "1";
                statusEl.textContent = `Modal closed. Session: ${session.nonce}`;
              },
              onPaymentComplete: ({ txDigest }) => {
                statusEl.textContent = "";
                const mainCard = document.querySelector(".card");
                if (!mainCard) return;
                const sym = currencies.find(c => c.code === currency)?.symbol || currency;
                mainCard.innerHTML = `
                  <span class="badge">Payment Complete</span>
                  <h1>Thank You!</h1>
                  <p>Your payment of <strong>${sym}${amount.toLocaleString()}</strong> has been confirmed on-chain.</p>
                  <div class="status ok" style="margin-top:16px;">
                    Tx Digest: ${txDigest}
                  </div>
                  <div class="row" style="margin-top:16px;">
                    <button id="pay-again-btn" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;box-shadow:0 10px 25px rgba(99,102,241,0.35);">
                      Pay Again
                    </button>
                  </div>
                `;
                mainCard.querySelector("#pay-again-btn")?.addEventListener("click", () => location.reload());
              },
            });
          } catch (err) {
            card.style.opacity = "1";
            statusEl.textContent = `Checkout failed: ${err.message}`;
            statusEl.className = "status err";
          }
        });
      });
    }

    init();
  </script>
</body>

</html>
