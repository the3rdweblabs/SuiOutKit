<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuiOutKit Multi-Currency Local Demo</title>
  <link rel="stylesheet" href="http://localhost:5000/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1e293b;
      color: oklch(95% 0 0);
      font-family: 'Albert Sans', 'Avenir Next', 'Helvetica Neue', Arial, system-ui, sans-serif;
      padding: 24px;
    }

    .card {
      width: min(780px, 100%);
      padding: 40px;
      border-radius: 10px;
      background: #1e293b;
      border: 1px solid oklch(92% 0 0 / 0.13);
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: #4E75F8;
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    h1 {
      font-family: 'Alumni Sans', 'Albert Sans', Arial, sans-serif;
      margin: 16px 0 8px;
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.01em;
    }

    p {
      color: oklch(80% 0 0);
      line-height: 1.6;
    }

    code {
      color: oklch(70% 0.12 188);
      font-family: 'SFMono-Regular', 'Roboto Mono', Consolas, monospace;
      font-size: 0.9em;
    }

    .currency-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
      margin-top: 24px;
    }

    .currency-card {
      border: 1px solid oklch(92% 0 0 / 0.13);
      border-radius: 6px;
      padding: 18px 14px;
      background: transparent;
      cursor: pointer;
      transition: border-color 0.15s ease;
      text-align: center;
    }

    .currency-card:hover {
      border-color: oklch(74% 0.09 82 / 0.6);
    }

    .currency-card:active {
      border-color: #4E75F8;
    }

    .currency-card .symbol {
      font-family: 'Alumni Sans', 'Albert Sans', Arial, sans-serif;
      font-size: 26px;
      font-weight: 300;
      color: #4E75F8;
    }

    .currency-card .code {
      font-size: 12px;
      color: oklch(80% 0 0);
      margin-top: 4px;
    }

    .currency-card .amount {
      font-size: 15px;
      font-weight: 600;
      color: oklch(95% 0 0);
      margin-top: 10px;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    button {
      border: 0;
      border-radius: 4px;
      padding: 14px 22px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    #reload-btn {
      background: transparent;
      color: oklch(80% 0 0);
      border: 1px solid oklch(92% 0 0 / 0.13);
    }

    .status {
      margin-top: 22px;
      padding: 14px 16px;
      border-radius: 6px;
      background: #1e293b;
      border: 1px solid oklch(92% 0 0 / 0.13);
      font-family: 'SFMono-Regular', 'Roboto Mono', Consolas, monospace;
      font-size: 12px;
      white-space: pre-wrap;
      min-height: 40px;
    }

    .ok { color: oklch(70% 0.12 188); }
    .err { color: oklch(58% 0.15 35); }
  </style>
</head>

<body>
  <main class="card">
    <span class="badge">Multi-Currency Local Demo</span>
    <h1>Pay in Your Currency</h1>
    <p>
      Local test: loads SDK from backend, pick a currency to checkout with the correct symbol and rate.
      Backend: <code>http://localhost:5000</code>
    </p>

    <div class="currency-grid" id="currency-grid"></div>

    <div class="row" style="margin-top: 16px;">
      <button id="reload-btn">Retry backend check</button>
    </div>

    <div class="status" id="status">Waiting for backend health check...</div>
  </main>

  <script type="module">
    const BACKEND_URL = "http://localhost:5000";
    const MERCHANT_ADDRESS = "0x534e227f48fc630b92298948ee57b75db82e7388896f4eefe34e040494f61581";
    const SDK_URL = "http://localhost:5000/sdk/dist/index.js";

    const currencies = [
      { code: "NGN", symbol: "\u20A6", amount: 1500, name: "Nigerian Naira" },
      { code: "USD", symbol: "$",    amount: 10,   name: "US Dollar" },
      { code: "GBP", symbol: "\u00A3", amount: 8,   name: "British Pound" },
      { code: "EUR", symbol: "\u20AC", amount: 9,   name: "Euro" },
      { code: "CAD", symbol: "C$",   amount: 13,   name: "Canadian Dollar" },
      { code: "AUD", symbol: "A$",   amount: 15,   name: "Australian Dollar" },
      { code: "JPY", symbol: "\u00A5", amount: 1500, name: "Japanese Yen" },
      { code: "INR", symbol: "\u20B9", amount: 850,  name: "Indian Rupee" },
      { code: "BRL", symbol: "R$",   amount: 50,   name: "Brazilian Real" },
      { code: "ZAR", symbol: "R",    amount: 190,  name: "South African Rand" },
      { code: "KES", symbol: "KSh",  amount: 1300, name: "Kenyan Shilling" },
      { code: "SGD", symbol: "S$",   amount: 13,   name: "Singapore Dollar" },
    ];

    const statusEl = document.getElementById("status");
    const grid = document.getElementById("currency-grid");
    const reloadBtn = document.getElementById("reload-btn");

    async function backendReady() {
      try {
        const res = await fetch(`${BACKEND_URL}/health`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const body = await res.json();
        statusEl.textContent = `Backend ready: ${body.service}`;
        statusEl.className = "status ok";
        return true;
      } catch (err) {
        statusEl.textContent = `Backend not reachable: ${err.message}`;
        statusEl.className = "status err";
        return false;
      }
    }

    async function loadSdk() {
      const module = await import(SDK_URL);
      return module.SuiOutKit;
    }

    let sdk;

    async function init() {
      const online = await backendReady();
      if (!online) return;

      try {
        const SuiOutKit = await loadSdk();
        sdk = new SuiOutKit({ merchantAddress: MERCHANT_ADDRESS, mode: "local" });
        statusEl.textContent = `SDK loaded from ${SDK_URL}\nClick a currency below to pay.`;
        statusEl.className = "status ok";
        renderCards();
      } catch (err) {
        statusEl.textContent = `SDK failed to load: ${err.message}`;
        statusEl.className = "status err";
      }
    }

    function renderCards() {
      grid.innerHTML = currencies.map((c) => `
        <div class="currency-card" data-currency="${c.code}" data-amount="${c.amount}">
          <div class="symbol">${c.symbol}</div>
          <div class="code">${c.code} &middot; ${c.name}</div>
          <div class="amount">${c.symbol}${c.amount.toLocaleString()}</div>
        </div>
      `).join("");

      grid.querySelectorAll(".currency-card").forEach((card) => {
        card.addEventListener("click", async () => {
          const currency = card.dataset.currency;
          const amount = parseInt(card.dataset.amount, 10);
          if (!sdk) return;

          card.style.opacity = "0.5";
          statusEl.textContent = `Creating ${currency} checkout session...`;
          statusEl.className = "status";

          try {
            const usdcSettlements = ["USD", "EUR", "GBP", "CAD", "AUD"];
            const multiTokenSettlements = ["INR", "BRL", "ZAR"];
            let settlementToken = undefined;
            if (usdcSettlements.includes(currency)) {
              settlementToken = "USDC";
            } else if (multiTokenSettlements.includes(currency)) {
              settlementToken = ["SUI", "USDC"];
            }
            const session = await sdk.initCheckout({
              amount,
              currency,
              metadata: { source: "demo(multi-currency local).html", currency },
              ...(settlementToken ? { settlementToken } : {})
            });
            statusEl.textContent = `Session created (${session.resolvedCurrency || currency}). Opening modal...`;
            sdk.openModal(session, {
              autoCloseOnSuccess: true,
              onClose: () => {
                card.style.opacity = "1";
                statusEl.textContent = `Modal closed. Session: ${session.nonce}`;
              },
              onPaymentComplete: ({ txDigest }) => {
                statusEl.textContent = "";
                const mainCard = document.querySelector(".card");
                if (!mainCard) return;
                const sym = currencies.find(c => c.code === currency)?.symbol || currency;
                mainCard.innerHTML = `
                  <span class="badge">Payment Complete</span>
                  <h1>Thank You!</h1>
                  <p>Your payment of <strong>${sym}${amount.toLocaleString()}</strong> has been confirmed on-chain.</p>
                  <div class="status ok" style="margin-top:16px;">
                    Tx Digest: ${txDigest}
                  </div>
                  <div class="row" style="margin-top:16px;">
                    <button id="pay-again-btn" style="background:#4E75F8;color:#ffffff;border:1px solid oklch(74% 0.09 82 / 0.3);border-radius:4px;padding:14px 22px;font-weight:600;cursor:pointer;">
                      Pay Again
                    </button>
                  </div>
                `;
                mainCard.querySelector("#pay-again-btn")?.addEventListener("click", () => location.reload());
              },
            });
          } catch (err) {
            card.style.opacity = "1";
            statusEl.textContent = `Checkout failed: ${err.message}`;
            statusEl.className = "status err";
          }
        });
      });
    }

    reloadBtn.addEventListener("click", init);
    init();
  </script>
</body>

</html>
