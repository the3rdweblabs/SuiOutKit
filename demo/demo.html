<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuiOutKit SDK Demo</title>
  <link rel="stylesheet" href="https://api.staging.suioutkit.xyz/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #1e293b;
      color: oklch(95% 0 0);
      font-family: 'Albert Sans', 'Avenir Next', 'Helvetica Neue', Arial, system-ui, sans-serif;
      padding: 24px;
    }

    .card {
      width: min(720px, 100%);
      padding: 40px;
      border-radius: 10px;
      background: #1e293b;
      border: 1px solid oklch(92% 0 0 / 0.13);
    }

    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: #4E75F8;
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    h1 {
      font-family: 'Alumni Sans', 'Albert Sans', Arial, sans-serif;
      margin: 16px 0 8px;
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.01em;
    }

    p {
      color: oklch(80% 0 0);
      line-height: 1.6;
    }

    code {
      color: oklch(70% 0.12 188);
      font-family: 'SFMono-Regular', 'Roboto Mono', Consolas, monospace;
      font-size: 0.9em;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    button {
      border: 0;
      border-radius: 4px;
      padding: 14px 22px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    #checkout-btn {
      background: #4E75F8;
      color: #ffffff;
      border: 1px solid oklch(74% 0.09 82 / 0.3);
    }

    #checkout-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #reload-btn {
      background: transparent;
      color: oklch(80% 0 0);
      border: 1px solid oklch(92% 0 0 / 0.13);
    }

    .status {
      margin-top: 22px;
      padding: 14px 16px;
      border-radius: 6px;
      background: #1e293b;
      border: 1px solid oklch(92% 0 0 / 0.13);
      font-family: 'SFMono-Regular', 'Roboto Mono', Consolas, monospace;
      font-size: 12px;
      white-space: pre-wrap;
      min-height: 72px;
    }

    .ok {
      color: oklch(70% 0.12 188);
    }

    .err {
      color: oklch(58% 0.15 35);
    }
  </style>
</head>

<body>
  <main class="card">
    <span class="badge">SuiOutKit Demo</span>
    <h1>Trion Storefront</h1>
    <p>
      This page loads the SDK from CDN, creates a checkout session, and opens the live modal.
      Backend: <code>https://api.staging.suioutkit.xyz</code>
    </p>

    <div class="row">
      <button id="checkout-btn" disabled>Initializing SDK...</button>
      <button id="reload-btn">Retry backend check</button>
    </div>

    <div class="status" id="status">Waiting for backend health check...</div>
  </main>

  <script type="module">
    const BACKEND_URL = "https://api.staging.suioutkit.xyz";
    const MERCHANT_ADDRESS = "0x534e227f48fc630b92298948ee57b75db82e7388896f4eefe34e040494f61581";
    const SDK_URL = "https://unpkg.com/suioutkit@latest/dist/index.js";

    const statusEl = document.getElementById("status");
    const checkoutBtn = document.getElementById("checkout-btn");
    const reloadBtn = document.getElementById("reload-btn");

    async function backendReady() {
      try {
        const res = await fetch(`${BACKEND_URL}/health`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const body = await res.json();
        statusEl.textContent = `Backend ready: ${body.service}`;
        statusEl.className = "status ok";
        return true;
      } catch (err) {
        statusEl.textContent = `Backend not reachable: ${err.message}`;
        statusEl.className = "status err";
        return false;
      }
    }

    async function loadSdk() {
      try {
        const module = await import(SDK_URL);
        return module.SuiOutKit;
      } catch (err) {
        throw new Error(`Failed to load SDK: ${err.message}`);
      }
    }

    let sdk;

    async function init() {
      checkoutBtn.disabled = true;
      checkoutBtn.textContent = "Initializing SDK...";

      const online = await backendReady();
      if (!online) {
        checkoutBtn.textContent = "Backend offline";
        return;
      }

      try {
        const SuiOutKit = await loadSdk();
        sdk = new SuiOutKit({ merchantAddress: MERCHANT_ADDRESS, mode: "test" });
        checkoutBtn.disabled = false;
        checkoutBtn.textContent = "Pay ₦1000";
        statusEl.textContent = `SDK loaded from ${SDK_URL}\nMerchant: ${MERCHANT_ADDRESS}`;
        statusEl.className = "status ok";
      } catch (err) {
        checkoutBtn.textContent = "SDK load failed";
        statusEl.textContent = `SDK failed to load: ${err.message}`;
        statusEl.className = "status err";
      }
    }

    checkoutBtn.addEventListener("click", async () => {
      if (!sdk) return;
      checkoutBtn.disabled = true;
      try {
        statusEl.textContent = "Creating checkout session...";
        const session = await sdk.initCheckout({
          amount: 1000,
          currency: "NGN",
          metadata: { source: "demo.html", createdAt: new Date().toISOString() }
        });
        statusEl.textContent = `Session created: ${session.nonce}\nOpening modal...`;
        sdk.openModal(session, {
          autoCloseOnSuccess: true,
          onClose: () => {
            checkoutBtn.disabled = false;
            statusEl.textContent = `Modal closed. Session nonce: ${session.nonce}`;
          },
          onPaymentComplete: ({ txDigest, walrusBlobId }) => {
            statusEl.textContent = "";
            const card = document.querySelector(".card");
            if (!card) return;
            card.innerHTML = `
              <span class="badge">Payment Complete</span>
              <h1>Thank You!</h1>
              <p>Your payment of <strong>₦${session.amount.toLocaleString()}</strong> has been confirmed on-chain.</p>
              <div class="status ok" style="margin-top:16px;">
                Tx Digest: ${txDigest}<br>
                Walrus Blob ID: ${walrusBlobId}
              </div>
              <div class="row">
                <button id="pay-again-btn" style="background:#4E75F8;color:#ffffff;border:1px solid oklch(74% 0.09 82 / 0.3);">
                  Pay Again
                </button>
              </div>
            `;
            card.querySelector("#pay-again-btn")?.addEventListener("click", () => location.reload());
          },
        });
      } catch (err) {
        checkoutBtn.disabled = false;
        statusEl.textContent = `Checkout failed: ${err.message}`;
        statusEl.className = "status err";
      }
    });

    reloadBtn.addEventListener("click", init);
    init();
  </script>
</body>

</html>
